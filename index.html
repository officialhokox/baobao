<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>给宝宝的小问题 💗</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, Arial;
    background: linear-gradient(135deg, #ffe6f0, #fff5f8);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 92%;
    max-width: 520px;
    background: white;
    padding: 28px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.page { display: none; }
.active { display: block; }

.btn {
    padding: 12px 18px;
    border: none;
    border-radius: 18px;
    font-size: 16px;
    margin: 10px;
    transition: 0.2s;
    cursor: pointer;
}

.yes {
    background: #ff6fa5;
    color: white;
}

.no {
    background: #ddd;
    color: #333;
}

.btnRow {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    flex-wrap: wrap;
}

input {
    width: 90%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid #ddd;
    outline: none;
}
</style>
</head>

<body>

<div class="card">

<!-- PAGE 1 -->
<div class="page active" id="p1">
    <h1>宝宝 ❤️</h1>
    <p>我想问你一些小问题，可以吗？</p>
    <button class="btn yes" onclick="go(2)">可以</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
    <h2>第一件事</h2>
    <p>如果有一天我们出去，你会期待吗？</p>
    <div class="btnRow">
        <button class="btn yes" onclick="go(3)">会</button>
        <button class="btn no" id="no1">不会</button>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
    <h2>第二件事</h2>
    <p>如果是一个轻松的约会，你会愿意吗？</p>
    <div class="btnRow">
        <button class="btn yes" onclick="go(4)">愿意</button>
        <button class="btn no" id="no2">不太想</button>
    </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="p4">
    <h2>如果我们真的出去 💗</h2>

    <p>你想做什么？</p>
    <input type="text" id="q1" placeholder="例如：吃饭 / 看电影 / 散步 / 打游戏...">

    <p>你想去哪里？</p>
    <input type="text" id="q2" placeholder="商场 / 咖啡店 / 随便都可以">

    <p>你喜欢什么氛围？</p>
    <input type="text" id="q3" placeholder="安静 / 热闹 / 随意">

    <button class="btn yes" onclick="submitAnswers()">提交</button>
</div>

<!-- FINAL YES -->
<div class="page" id="p5">
    <!-- filled by JS -->
</div>

<!-- NO RESULT -->
<div class="page" id="p6">
    <h2>没关系 ❤️</h2>
    <p style="line-height:1.6;">
        真的不用有压力。<br><br>
        我只是想问问你的想法。<br><br>
        还是很开心认识你。
    </p>
</div>

</div>

<script>

function go(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("p" + page).classList.add("active");
}

/* 💗 PLAYFUL RUNAWAY BUTTON */
function setupNo(id, finalPage = 6) {
    const btn = document.getElementById(id);
    let count = 0;

    function dodge() {
        count++;

        if (count > 4) {
            btn.innerText = "好吧...";
            btn.onclick = () => go(finalPage);
            btn.onmouseover = null;
            btn.ontouchstart = null;
            btn.style.position = "relative";
            btn.style.left = "0px";
            return;
        }

        const parent = btn.parentElement;
        const maxX = parent.clientWidth - btn.clientWidth;

        const x = Math.random() * maxX;

        btn.style.position = "relative";
        btn.style.left = x + "px";

        const texts = [
            "不要～",
            "再想想🥺",
            "真的不吗？",
            "别点这个"
        ];

        btn.innerText = texts[count - 1] || "不要";
    }

    btn.onclick = dodge;
    btn.ontouchstart = dodge;
    btn.onmouseover = dodge;
}

/* SUBMIT + SHOW ANSWERS */
function submitAnswers() {
    const q1 = document.getElementById("q1").value || "（没写）";
    const q2 = document.getElementById("q2").value || "（没写）";
    const q3 = document.getElementById("q3").value || "（没写）";

    document.getElementById("p5").innerHTML = `
        <h1>那就约定好了 ❤️</h1>

        <p style="line-height:1.6;">
            <b>想做的事：</b><br>
            ${q1}<br><br>

            <b>想去的地方：</b><br>
            ${q2}<br><br>

            <b>喜欢的氛围：</b><br>
            ${q3}<br><br>

            --------------------<br><br>

            我会记住这些 💗<br><br>
            不急、不催、慢慢来。<br><br>

            🥺 如果你看到这一页，可以截图发给我吗？
        </p>
    `;

    go(5);
}

/* INIT */
setupNo("no1");
setupNo("no2");

</script>

</body>
</html>
